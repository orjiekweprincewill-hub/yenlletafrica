<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YENLLET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #0a1628;
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --accent: #00bcd4;
            --accent-light: #4fc3f7;
            --white: #ffffff;
            --off-white: #f0f4f8;
            --gray: #8892b0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,188,212,0.08) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .logo-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22vw;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(0,188,212,0.03) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            white-space: nowrap;
        }

        .container {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0,188,212,0.1);
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
        }

        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 35px rgba(0, 188, 212, 0.4);
        }

        .btn:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 22px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(46, 125, 50, 0.15);
            color: #81c784;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .alert-error {
            background: rgba(198, 40, 40, 0.15);
            color: #ef5350;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: var(--accent-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link a:hover { 
            color: var(--white);
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="logo-watermark">YENLLET</div>

    <div class="container">
        <div class="logo">
            <h1><i class="bi bi-key"></i> YENLLET</h1>
            <p>Create a new password</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="Re-enter password" required minlength="6">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <i class="bi bi-check-circle"></i> Reset Password
            </button>
        </form>

        <div class="back-link">
            <a href="login.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const alertBox = document.getElementById('alertBox');
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        // Validate token on page load
        if (!token) {
            showAlert('❌ Invalid or missing reset token. Please request a new reset link.', 'error');
            form.style.display = 'none';
        } else {
            // Verify token is valid
            fetch(`${API_URL}/api/verify-reset-token?token=${token}`)
                .then(r => r.json())
                .then(data => {
                    if (!data.valid) {
                        showAlert('❌ This reset link has expired or is invalid. Please request a new one.', 'error');
                        form.style.display = 'none';
                    }
                })
                .catch(() => {
                    showAlert('❌ Could not verify token. Please try again.', 'error');
                });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPass = document.getElementById('new_password').value;
            const confirmPass = document.getElementById('confirm_password').value;

            if (newPass !== confirmPass) {
                showAlert('❌ Passwords do not match!', 'error');
                return;
            }
            if (newPass.length < 6) {
                showAlert('❌ Password must be at least 6 characters.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Resetting...';

            try {
                const response = await fetch(`${API_URL}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPass })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('✅ Password updated successfully! Redirecting to login...', 'success');
                    form.style.display = 'none';
                    setTimeout(() => window.location.href = 'login.html', 3000);
                } else {
                    showAlert('❌ ' + (data.error || 'Failed to reset password'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Network error! Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
            }
        });
    </script>
</body>
</html>
