<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - YENLLET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #0a1628;
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --accent: #00bcd4;
            --accent-light: #4fc3f7;
            --white: #ffffff;
            --off-white: #f0f4f8;
            --gray: #8892b0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background glow */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,188,212,0.08) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Logo watermark background */
        .logo-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 25vw;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(0,188,212,0.03) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            white-space: nowrap;
        }

        .login-container {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0,188,212,0.1);
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--gray);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 188, 212, 0.4);
        }

        .login-btn:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 22px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(46, 125, 50, 0.15);
            color: #81c784;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .alert-error {
            background: rgba(198, 40, 40, 0.15);
            color: #ef5350;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .links a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 22px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }

        .divider span {
            background: transparent;
            padding: 0 12px;
            position: relative;
            color: var(--gray);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .admin-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.85);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .admin-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .register-link a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }
            .logo h1 {
                font-size: 1.8rem;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="logo-watermark">YENLLET</div>

    <div class="login-container">
        <div class="logo">
            <h1>YENLLET</h1>
            <p>Welcome back!</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>

        <div class="links">
            <a href="forgot-password.html"><i class="bi bi-key"></i> Forgot Password?</a>
            <a href="register.html">Create Account</a>
        </div>

        <div class="divider"><span>OR</span></div>

        <a href="login.html" class="admin-btn">
            <i class="bi bi-shield-lock"></i> Admin Login
        </a>

        <div class="register-link">
            Don't have an account? <a href="register.html">Register now</a>
        </div>
    </div>

    <script>
    const API_URL = '';

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';

            if (type === 'error') {
                setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('❌ ' + (data.error || 'Login failed'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }

                if (data.success) {
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    document.getElementById('loginForm').reset();

                    setTimeout(() => {
                        window.location.href = data.redirect || 'dashboard.html';
                    }, 1500);
                } else {
                    showAlert('❌ Login failed', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                showAlert('❌ Network error! Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
