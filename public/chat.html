<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d47a1">
    <title>Chat & Earn - YENLLET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-dark: #0a1628; --primary: #0d47a1; --primary-light: #1565c0; --accent: #00bcd4; --accent-light: #4fc3f7; --white: #ffffff; --off-white: #f0f4f8; --gray: #8892b0; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: var(--off-white); font-family: 'Inter', sans-serif; }
        .chat-container { display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        .top-header { background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(20px); padding: 15px 20px; display: flex; align-items: center; gap: 15px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; }
        .chat-partner-info { display: flex; align-items: center; gap: 10px; }
        .chat-partner-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-partner-name { font-weight: 600; font-size: 16px; }
        .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; word-wrap: break-word; }
        .message.sent { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message-time { font-size: 10px; color: #999; margin-top: 4px; text-align: right; }
        .input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #f0f0f0; padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; z-index: 100; }
        .input-area input { flex: 1; padding: 12px 15px; border: none; border-radius: 24px; font-size: 14px; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .file-btn { background: transparent; border: none; color: #666; font-size: 20px; cursor: pointer; padding: 5px; }
        .user-list-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; }
        .user-list-header { background: var(--primary-dark); color: white; padding: 15px 20px; font-weight: 700; font-size: 18px; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .user-item:hover { background: #f5f5f5; }
        .user-item img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .user-name { font-weight: 500; }
        .online-status { font-size: 12px; color: #999; }
        .online-status.online { color: #4caf50; }
        .no-users { text-align: center; padding: 40px; color: #999; }
        .alert { position: fixed; top: 80px; right: 20px; padding: 12px 18px; border-radius: 8px; color: white; z-index: 10000; font-size: 14px; }
        .alert-success { background: #4caf50; }
        .alert-error { background: #f44336; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="userListScreen" class="user-list-screen">
        <div class="user-list-header">Select a user to chat</div>
        <div class="user-list" id="userList"></div>
    </div>
    
    <div id="chatScreen" class="chat-container hidden">
        <div class="top-header">
            <a href="#" class="back-btn" onclick="showUserList()"><i class="bi bi-arrow-left"></i></a>
            <div class="chat-partner-info">
                <img id="partnerPic" src="https://via.placeholder.com/40" alt="User">
                <span class="chat-partner-name" id="partnerName">Select a user</span>
            </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
            <button class="file-btn" onclick="document.getElementById('fileInput').click()"><i class="bi bi-paperclip"></i></button>
            <input type="file" id="fileInput" hidden>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>

    <div id="alertContainer"></div>

    <script>
        const API_URL = 'https://yenlletafrica.onrender.com';
        let currentPartner = null; 
        let pollInterval = null;

        async function checkAuth() { 
            try { 
                const res = await fetch(`${API_URL}/api/profile`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } }); 
                if (res.status === 401) { window.location.href = 'login.html'; return false; } 
                return true; 
            } catch (e) { window.location.href = 'login.html'; return false; } 
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/api/all-users`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const users = await res.json(); 
                const list = document.getElementById('userList');
                if (users.length === 0) { list.innerHTML = '<div class="no-users">No other users found.</div>'; return; }
                list.innerHTML = users.map(u => `
                    <div class="user-item" onclick="openChat(${u.id}, '${escapeHtml(u.username)}', '${u.profile_picture || ''}')">
                        <img src="${u.profile_picture || 'https://via.placeholder.com/45'}" onerror="this.src='https://via.placeholder.com/45'">
                        <div><div class="user-name">${escapeHtml(u.username)}</div><div class="online-status ${u.is_online ? 'online' : ''}">${u.is_online ? 'Online' : 'Offline'}</div></div>
                    </div>`).join('');
            } catch (err) { console.error('Load users error:', err); }
        }

        function showUserList() { 
            clearInterval(pollInterval); 
            document.getElementById('userListScreen').classList.remove('hidden'); 
            document.getElementById('chatScreen').classList.add('hidden'); 
            currentPartner = null; 
        }

        async function openChat(partnerId, partnerName, partnerPic) {
            currentPartner = partnerId;
            document.getElementById('userListScreen').classList.add('hidden'); 
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('partnerName').textContent = partnerName;
            document.getElementById('partnerPic').src = partnerPic || 'https://via.placeholder.com/40';
            document.getElementById('messagesArea').innerHTML = '';
            
            await fetch(`${API_URL}/api/mark-messages-read/${partnerId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
            await fetch(`${API_URL}/api/start-chat-session`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }, body: JSON.stringify({ partner_id: partnerId }) });
            
            loadMessages(); 
            pollInterval = setInterval(loadMessages, 2000);
        }

        async function loadMessages() {
            if (!currentPartner) return;
            try {
                const res = await fetch(`${API_URL}/api/chat-messages/${currentPartner}`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const messages = await res.json(); 
                const area = document.getElementById('messagesArea');
                const wasAtBottom = area.scrollHeight - area.scrollTop === area.clientHeight;
                
                area.innerHTML = messages.map(m => `
                    <div class="message ${m.sender_id == localStorage.getItem('user_id') ? 'sent' : 'received'}">
                        ${m.message_type === 'image' ? `<img src="${m.file_url}" style="max-width:100%; border-radius:8px; margin-bottom:5px;" onerror="this.style.display='none'">` : ''}
                        ${m.message_type === 'voice' ? `<audio controls src="${m.file_url}"></audio>` : ''}
                        ${escapeHtml(m.message)}
                        <div class="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>`).join('');
                    
                if (wasAtBottom) area.scrollTop = area.scrollHeight;
            } catch (err) { console.error('Load messages error:', err); }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput'); 
            const text = input.value.trim();
            if (!text || !currentPartner) return; 
            input.value = '';
            try {
                await fetch(`${API_URL}/api/send-message`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }, 
                    body: JSON.stringify({ receiver_id: currentPartner, message: text }) 
                });
                loadMessages();
            } catch (err) { showAlert('Failed to send', 'error'); }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentPartner) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const uploadRes = await fetch(`${API_URL}/api/upload-chat-file`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }, body: formData });
                const uploadData = await uploadRes.json();
                if (uploadRes.ok) {
                    const isImage = file.type.startsWith('image/');
                    await fetch(`${API_URL}/api/send-message`, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }, 
                        body: JSON.stringify({ receiver_id: currentPartner, message: '', message_type: isImage ? 'image' : 'voice', file_url: uploadData.file_url, file_name: uploadData.file_name }) 
                    });
                    loadMessages();
                }
            } catch (err) { showAlert('Upload failed', 'error'); }
            e.target.value = '';
        });

        (async () => {
            if (await checkAuth()) {
                const profileRes = await fetch(`${API_URL}/api/profile`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const profile = await profileRes.json(); 
                localStorage.setItem('user_id', profile.user_id); 
                loadUsers();
            }
        })();
        
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
        function showAlert(msg, type) { const c = document.getElementById('alertContainer'); c.innerHTML = `<div class="alert alert-${type}">${msg}</div>`; setTimeout(() => c.innerHTML = '', 3000); }
    </script>
</body>
</html>
