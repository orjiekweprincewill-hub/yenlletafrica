<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d47a1">
    <title>Upgrade Plan - YENLLET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #0a1628;
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --accent: #00bcd4;
            --accent-light: #4fc3f7;
            --white: #ffffff;
            --off-white: #f0f4f8;
            --gray: #8892b0;
            --danger: #ef5350;
            --success: #81c784;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,188,212,0.08) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .upgrade-container {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0,188,212,0.1);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo i { font-size: 40px; color: var(--accent); margin-bottom: 10px; display: block; }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .logo p { color: var(--gray); font-size: 0.95rem; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 10px; color: rgba(255,255,255,0.85); font-weight: 500; font-size: 0.9rem; }
        
        .input-wrapper { position: relative; }
        .form-group input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.35); }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.15);
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.1rem;
        }

        .upgrade-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .upgrade-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(0, 188, 212, 0.4); }
        .upgrade-btn:disabled { background: #334155; cursor: not-allowed; transform: none; box-shadow: none; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert { padding: 14px; border-radius: 12px; margin-bottom: 22px; display: none; font-size: 0.9rem; font-weight: 500; }
        .alert-success { background: rgba(46, 125, 50, 0.15); color: var(--success); border: 1px solid rgba(46, 125, 50, 0.3); }
        .alert-error { background: rgba(198, 40, 40, 0.15); color: var(--danger); border: 1px solid rgba(198, 40, 40, 0.3); }

        .back-link { text-align: center; margin-top: 22px; color: var(--gray); font-size: 0.9rem; }
        .back-link a { color: var(--accent-light); text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="upgrade-container">
        <div class="logo">
            <i class="bi bi-stars"></i>
            <h1>Upgrade Plan</h1>
            <p>Enter your upgrade coupon code to unlock more rewards!</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="upgradeForm">
            <div class="form-group">
                <label for="couponCode">Upgrade Coupon Code</label>
                <div class="input-wrapper">
                    <input type="text" id="couponCode" placeholder="PRO12345 or VITE12345" required autofocus>
                    <span class="input-icon"><i class="bi bi-ticket-perforated"></i></span>
                </div>
            </div>

            <button type="submit" class="upgrade-btn" id="upgradeBtn">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Upgrade Now</span>
            </button>
        </form>

        <div class="back-link">
            <a href="dashboard.html"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://yenlletafrica.onrender.com';

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = message;
            alertBox.style.display = 'block';

            if (type === 'error') {
                setTimeout(() => { alertBox.style.display = 'none'; }, 6000);
            }
        }

        document.getElementById('upgradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const couponCode = document.getElementById('couponCode').value.trim();
            const upgradeBtn = document.getElementById('upgradeBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            upgradeBtn.disabled = true;
            btnText.textContent = 'Upgrading...';
            spinner.style.display = 'block';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); // Wait up to 60s for Render to wake up

                const response = await fetch(`${API_URL}/api/apply-upgrade-coupon`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ coupon_code: couponCode }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                const data = await response.json();

                if (!response.ok) {
                    let errorMsg = data.error || 'Upgrade failed. Please check your coupon code.';
                    // Make error messages more user-friendly
                    errorMsg = errorMsg.replace("Invalid upgrade. You are on ", "You are currently on ");
                    showAlert('❌ ' + errorMsg, 'error');
                    
                    btnText.textContent = 'Upgrade Now';
                    spinner.style.display = 'none';
                    upgradeBtn.disabled = false;
                    return;
                }

                if (data.success) {
                    showAlert(`✅ ${data.message} Redirecting to dashboard...`, 'success');
                    document.getElementById('upgradeForm').reset();

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2500);
                } else {
                    showAlert('❌ Upgrade failed. Please try again.', 'error');
                    btnText.textContent = 'Upgrade Now';
                    spinner.style.display = 'none';
                    upgradeBtn.disabled = false;
                }
            } catch (error) {
                console.error('Upgrade error:', error);
                let msg = '❌ Network error! Server might be sleeping. Please try again in a moment.';
                if (error.name === 'AbortError') {
                    msg = '❌ Server is taking too long to respond. Please try again.';
                }
                showAlert(msg, 'error');
                
                btnText.textContent = 'Upgrade Now';
                spinner.style.display = 'none';
                upgradeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
