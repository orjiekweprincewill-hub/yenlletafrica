<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Plan — YENLLET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f4f6f9 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 520px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
        }
        .logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #dc3545, #b02a37);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 30px;
        }
        h1 { font-size: 24px; margin-bottom: 6px; }
        p.sub { color: #6b7280; font-size: 14px; margin-bottom: 28px; }

        .plan-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }
        .plan-lite { background: #fef2f2; color: #dc3545; }
        .plan-pro { background: #eff6ff; color: #2563eb; }
        .plan-vite { background: #f5f3ff; color: #7c3aed; }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220,53,69,0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(220,53,69,0.25); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        .info-box {
            background: #f9fafb;
            border-left: 4px solid #dc3545;
            padding: 14px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .info-box i { color: #dc3545; margin-right: 8px; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { color: #dc3545; }

        .spin {
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"><i class="bi bi-arrow-up-circle-fill"></i></div>
        <h1>Upgrade Your Plan</h1>
        <p class="sub">Enter an upgrade coupon to unlock higher rewards</p>

        <div id="currentPlanBadge" class="plan-badge plan-lite">Current: YENLITE</div>

        <div id="alertBox" class="alert"></div>

        <div class="info-box">
            <i class="bi bi-info-circle-fill"></i>
            Upgrade coupons start with <strong>PRO</strong> or <strong>VITE</strong>. You cannot downgrade.
        </div>

        <form id="upgradeForm">
            <div class="form-group">
                <label for="coupon">Upgrade Coupon Code</label>
                <input type="text" id="coupon" class="form-control" placeholder="Example: PROABC123" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="bi bi-check2-circle"></i> Apply Upgrade
            </button>
        </form>

        <a href="dashboard.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>

    <script>
        const API = 'http://localhost:5000';

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
        }

        async function init() {
            try {
                const res = await fetch(`${API}/api/check-session`, { credentials: 'include' });
                const data = await res.json();
                if (!data.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }

                // Load profile to show current plan
                const profileRes = await fetch(`${API}/api/profile`, { credentials: 'include' });
                const profile = await profileRes.json();
                if (profile.plan) {
                    const badge = document.getElementById('currentPlanBadge');
                    badge.textContent = `Current: ${profile.plan}`;
                    badge.className = `plan-badge plan-${profile.plan.toLowerCase().replace('yen','')}`;
                }
            } catch (e) {
                console.error('Init error:', e);
            }
        }

        document.getElementById('upgradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const coupon = document.getElementById('coupon').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!coupon) return;

            btn.disabled = true;
            btn.innerHTML = '<div class="spin"></div> Processing...';

            try {
                const res = await fetch(`${API}/api/apply-upgrade-coupon`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ coupon_code: coupon })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(`🎉 Upgraded to ${data.new_plan}! Welcome bonus: ¥${data.welcome_bonus.toLocaleString()}`, 'success');
                    document.getElementById('currentPlanBadge').textContent = `Current: ${data.new_plan}`;
                    document.getElementById('coupon').value = '';
                } else {
                    showAlert(data.error || 'Upgrade failed. Check your coupon code.', 'error');
                }
            } catch (err) {
                showAlert('Network error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check2-circle"></i> Apply Upgrade';
            }
        });

        init();
    </script>
    <script>
(async function(){
  try {
    const r = await fetch('http://localhost:5000/api/profile', { credentials: 'include' });
    if(r.ok){ const d = await r.json(); if(d.dark_mode) document.body.classList.add('dark-mode'); }
  } catch(e){}
})();
</script>
</body>
</html>
