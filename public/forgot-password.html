<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - YENLLET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #0a1628;
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --accent: #00bcd4;
            --accent-light: #4fc3f7;
            --white: #ffffff;
            --off-white: #f0f4f8;
            --gray: #8892b0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,188,212,0.08) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .logo-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22vw;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(0,188,212,0.03) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            white-space: nowrap;
        }

        .container {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0,188,212,0.1);
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.15);
        }

        .help-text {
            font-size: 0.82rem;
            color: var(--gray);
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 188, 212, 0.4);
        }

        .btn:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 22px;
            display: none;
            animation: slideDown 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(46, 125, 50, 0.15);
            color: #81c784;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .alert-error {
            background: rgba(198, 40, 40, 0.15);
            color: #ef5350;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .alert-info {
            background: rgba(21, 101, 192, 0.15);
            color: var(--accent-light);
            border: 1px solid rgba(0, 188, 212, 0.3);
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .links a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            margin: 0 5px;
            transition: var(--transition);
        }

        .links a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .icon {
            text-align: center;
            margin-bottom: 22px;
        }

        .icon i {
            font-size: 48px;
            color: var(--accent);
        }

        .steps {
            background: rgba(255,255,255,0.05);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 22px;
            font-size: 0.85rem;
            color: var(--gray);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .steps ol {
            margin-left: 20px;
            line-height: 1.8;
        }

        .steps li {
            margin-bottom: 5px;
        }

        .steps li::marker {
            color: var(--accent);
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="logo-watermark">YENLLET</div>

    <div class="container">
        <div class="header">
            <h1>🔑 Reset Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <div id="emailForm">
            <div class="icon">
                <i class="bi bi-envelope"></i>
            </div>

            <div class="steps">
                <ol>
                    <li>Enter your registered email address</li>
                    <li>Check your email for the reset link</li>
                    <li>Click the link to create a new password</li>
                </ol>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                    <div class="help-text">The email you registered with</div>
                </div>

                <button type="submit" class="btn" id="sendBtn">Send Reset Link</button>
            </form>

            <div class="links">
                <a href="login.html">← Back to Login</a> | 
                <a href="register.html">Create Account</a>
            </div>
        </div>

        <div id="resetForm" style="display: none;">
            <div class="icon">
                <i class="bi bi-check-circle"></i>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
                    <div id="passwordError" class="help-text" style="color: #ef5350; display: none;"></div>
                </div>

                <button type="submit" class="btn" id="resetBtn">Update Password</button>
            </form>

            <div class="links">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
    const API_URL = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        // Check if user has a reset token
        if (resetToken) {
            verifyToken(resetToken);
        }

        // Handle forgot password form
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const sendBtn = document.getElementById('sendBtn');

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_URL}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✅ ' + data.message + ' Check your email inbox.', 'success');
                    document.getElementById('forgotPasswordForm').reset();
                } else {
                    showAlert('❌ ' + (data.error || 'Failed to process request'), 'error');
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send Reset Link';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Network error! Please try again.', 'error');
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Reset Link';
            }
        });

        // Verify reset token
        async function verifyToken(token) {
            try {
                const response = await fetch(`${API_URL}/api/verify-reset-token?token=${token}`);
                const data = await response.json();

                if (response.ok && data.valid) {
                    // Show reset form
                    document.getElementById('emailForm').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';

                    // Store token for password reset
                    window.resetToken = token;

                    showAlert('✅ Token verified! Enter your new password below.', 'info');
                } else {
                    showAlert('❌ ' + (data.error || 'Invalid or expired token'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Error verifying token', 'error');
            }
        }

        // Handle password reset form
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordError = document.getElementById('passwordError');

            // Clear error
            passwordError.style.display = 'none';

            if (newPassword !== confirmPassword) {
                passwordError.textContent = 'Passwords do not match';
                passwordError.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.style.display = 'block';
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating...';

            try {
                const response = await fetch(`${API_URL}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: window.resetToken,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✅ Password updated successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert('❌ ' + (data.error || 'Failed to reset password'), 'error');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Update Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Network error! Please try again.', 'error');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Update Password';
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = message;
            alertBox.style.display = 'block';

            if (type !== 'success' && type !== 'info') {
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
