<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Receipt - YENLLET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --bg: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .receipt-wrapper {
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Paper receipt */
        .receipt-paper {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Tear lines */
        .tear-line {
            height: 12px;
            background-image: radial-gradient(circle, transparent 6px, #ffffff 6px);
            background-size: 18px 18px;
            background-position: -9px center;
            background-repeat: repeat-x;
            position: relative;
        }

        .tear-line.top {
            background-position: -9px bottom;
            margin-top: -6px;
            transform: rotate(180deg);
        }

        .tear-line.bottom {
            background-position: -9px top;
            margin-bottom: -6px;
        }

        /* Header */
        .receipt-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 35px 24px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .receipt-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .receipt-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            position: relative;
        }

        .receipt-header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            font-weight: 400;
            position: relative;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 18px;
            border: 2px solid;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .status-pill.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .status-pill.approved {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .status-pill.rejected {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Amount Section */
        .amount-section {
            padding: 32px 24px;
            text-align: center;
            border-bottom: 2px dashed var(--border);
            position: relative;
        }

        .amount-section::before,
        .amount-section::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 20px;
            background: #0f172a;
            border-radius: 50%;
        }

        .amount-section::before { left: -10px; }
        .amount-section::after { right: -10px; }

        .amount-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .amount-value {
            font-family: 'Inter', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .amount-converted {
            font-size: 15px;
            color: var(--text-light);
            font-weight: 500;
        }

        .amount-converted strong {
            color: var(--success);
            font-weight: 700;
        }

        /* Details Grid */
        .details-section {
            padding: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-icon-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-icon {
            width: 32px;
            height: 32px;
            background: #f3f4f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 14px;
        }

        .detail-label {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
        }

        .detail-value {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            text-align: right;
            max-width: 55%;
            word-break: break-word;
        }

        .detail-value.status-text {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value.status-text.pending { color: var(--warning); }
        .detail-value.status-text.approved { color: var(--success); }
        .detail-value.status-text.rejected { color: var(--danger); }

        /* Barcode Section */
        .barcode-section {
            padding: 20px 24px 30px;
            text-align: center;
            border-top: 2px dashed var(--border);
            position: relative;
        }

        .barcode-section::before,
        .barcode-section::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            background: #0f172a;
            border-radius: 50%;
        }

        .barcode-section::before { left: -10px; }
        .barcode-section::after { right: -10px; }

        .barcode {
            height: 50px;
            background: repeating-linear-gradient(
                90deg,
                #1f2937 0px,
                #1f2937 2px,
                transparent 2px,
                transparent 4px,
                #1f2937 4px,
                #1f2937 6px,
                transparent 6px,
                transparent 10px,
                #1f2937 10px,
                #1f2937 12px,
                transparent 12px,
                transparent 14px
            );
            margin-bottom: 8px;
            opacity: 0.8;
            border-radius: 4px;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .barcode-id {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .receipt-footer-text {
            padding: 0 24px 24px;
            text-align: center;
        }

        .receipt-footer-text p {
            font-size: 11px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .receipt-footer-text .brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 12px;
        }


        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }

        .logo img {
            height: 35px;
            width: auto;
            border-radius: 8px;
        }

        .logo span {
            background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Action Buttons */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px 0 0;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-download {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-download:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(30, 60, 114, 0.4);
        }

        .btn-share {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: 2px solid transparent;
        }

        .btn-share:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(30, 60, 114, 0.4);
        }

        .btn-back {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            grid-column: 1 / -1;
            backdrop-filter: blur(10px);
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Loading & Error */
        .loading-screen {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .loading-screen i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
            opacity: 0.8;
        }

        .error-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .error-card i {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 16px;
            display: block;
        }

        .error-card h3 {
            color: var(--text);
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* Alert */
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.95);
            color: white;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.95);
            color: white;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Print optimization */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .receipt-wrapper {
                max-width: 100%;
                animation: none;
            }
            .actions, .btn-back {
                display: none !important;
            }
            .receipt-paper {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .amount-value { font-size: 32px; }
            .receipt-header { padding: 28px 20px 24px; }
            .details-section { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="alert-container" id="alertContainer"></div>

    <div id="loadingScreen" class="loading-screen">
        <i class="bi bi-receipt-cutoff"></i>
        <p style="font-size: 16px; opacity: 0.9;">Loading receipt...</p>
    </div>

    <div class="receipt-wrapper" id="receiptContainer" style="display: none;">
        <div class="receipt-paper">
            <div class="tear-line top"></div>
            
            <div class="receipt-header">
                <div class="brand-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <a href="index.html" class="logo">
                <img src="IMG-20260414-WA0002.jpg" alt="YenlletAfrica" onerror="this.style.display='none'">
                
            </a>
                <h1>YENLLET</h1>
                <p class="subtitle">Official Withdrawal Receipt</p>
                <div class="status-pill" id="statusBadge">PENDING</div>
            </div>

            <div class="amount-section">
                <div class="amount-label">Amount Withdrawn</div>
                <div class="amount-value" id="amount">¥0</div>
                <div class="amount-converted" id="nairaEquivalent">-</div>
            </div>

            <div class="details-section">
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-upc-scan"></i></div>
                        <span class="detail-label">Receipt ID</span>
                    </div>
                    <span class="detail-value" id="receiptId">#-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-person"></i></div>
                        <span class="detail-label">Username</span>
                    </div>
                    <span class="detail-value" id="username">-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-wallet2"></i></div>
                        <span class="detail-label">Wallet Type</span>
                    </div>
                    <span class="detail-value" id="walletType">-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-bank"></i></div>
                        <span class="detail-label">Bank Name</span>
                    </div>
                    <span class="detail-value" id="bankName">-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-credit-card-2-front"></i></div>
                        <span class="detail-label">Account Number</span>
                    </div>
                    <span class="detail-value" id="accountNumber">-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-calendar3"></i></div>
                        <span class="detail-label">Date</span>
                    </div>
                    <span class="detail-value" id="date">-</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon-label">
                        <div class="detail-icon"><i class="bi bi-flag"></i></div>
                        <span class="detail-label">Status</span>
                    </div>
                    <span class="detail-value status-text" id="status">-</span>
                </div>
            </div>

            <div class="barcode-section">
                <div class="barcode"></div>
                <div class="barcode-id" id="transactionId">TXN-00000000</div>
            </div>

            <div class="receipt-footer-text">
                <p class="brand">YENLLET</p>
                <p>Thank you for using our platform.<br>This receipt serves as proof of your withdrawal request.</p>
                <p style="margin-top: 8px; font-size: 10px; opacity: 0.7;" id="timestamp">Generated: -</p>
            </div>

            <div class="tear-line bottom"></div>
        </div>

        <div class="actions">
            <button class="btn btn-download" id="downloadBtn" onclick="downloadReceipt()">
                <i class="bi bi-download"></i> Download
            </button>
            <button class="btn btn-share" id="shareBtn" onclick="shareReceipt()">
                <i class="bi bi-share-fill"></i> Share
            </button>
            <button class="btn btn-back" onclick="goBack()">
                <i class="bi bi-arrow-left"></i> Back to Withdrawals
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const API_URL = 'http://localhost:5000';
        const YEN_TO_NAIRA_RATE = 9.34;

        async function loadReceipt() {
            const urlParams = new URLSearchParams(window.location.search);
            const withdrawalId = urlParams.get('id');

            if (!withdrawalId) {
                showError('Invalid receipt link. No withdrawal ID provided.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/withdrawal-receipt/${withdrawalId}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    showError('Receipt not found or access denied.');
                    return;
                }

                const data = await response.json();

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('receiptContainer').style.display = 'block';

                // Populate data
                document.getElementById('receiptId').textContent = `#${String(data.id).padStart(6, '0')}`;
                document.getElementById('username').textContent = data.username;
                document.getElementById('walletType').textContent = data.wallet_type.charAt(0).toUpperCase() + data.wallet_type.slice(1);
                
                if (data.wallet_type === 'tiktok') {
                    document.getElementById('amount').textContent = `$${data.amount.toLocaleString()}`;
                    document.getElementById('nairaEquivalent').textContent = `≈ ₦${(data.amount * 1650).toLocaleString()}`;
                } else {
                    document.getElementById('amount').textContent = `¥${data.amount.toLocaleString()}`;
                    const nairaAmount = (data.amount * YEN_TO_NAIRA_RATE).toFixed(2);
                    document.getElementById('nairaEquivalent').innerHTML = `Equivalent: <strong>₦${parseFloat(nairaAmount).toLocaleString()}</strong>`;
                }

                document.getElementById('bankName').textContent = data.bank_name;
                document.getElementById('accountNumber').textContent = data.account_number;
                
                const date = new Date(data.created_at);
                document.getElementById('date').textContent = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const statusText = data.status.toUpperCase();
                document.getElementById('status').textContent = statusText;
                document.getElementById('status').className = `detail-value status-text ${data.status}`;
                
                document.getElementById('transactionId').textContent = `TXN${String(data.id).padStart(8, '0')}${Date.now().toString().slice(-4)}`;
                document.getElementById('timestamp').textContent = `Generated: ${new Date().toLocaleString()}`;

                const statusBadge = document.getElementById('statusBadge');
                statusBadge.textContent = statusText;
                statusBadge.className = `status-pill ${data.status}`;

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load receipt. Please try again.');
            }
        }

        async function downloadReceipt() {
            const downloadBtn = document.getElementById('downloadBtn');
            const originalText = downloadBtn.innerHTML;
            
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving...';

            try {
                const receiptPaper = document.querySelector('.receipt-paper');
                
                const canvas = await html2canvas(receiptPaper, {
                    scale: 4,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowHeight: receiptPaper.scrollHeight + 40,
                    windowWidth: receiptPaper.scrollWidth + 40,
                    imageTimeout: 5000
                });

                const link = document.createElement('a');
                const receiptId = document.getElementById('receiptId').textContent.replace('#', '');
                const filename = `TASKNEST-Receipt-${receiptId}.png`;
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    showAlert('✅ Receipt saved to downloads', 'success');
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = originalText;
                }, 'image/png', 1.0);

            } catch (error) {
                console.error('Download error:', error);
                showAlert('❌ Download failed. Try sharing instead.', 'error');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = originalText;
            }
        }

        async function shareReceipt() {
            const shareBtn = document.getElementById('shareBtn');
            const originalText = shareBtn.innerHTML;
            
            shareBtn.disabled = true;
            shareBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Preparing...';

            try {
                const receiptPaper = document.querySelector('.receipt-paper');
                
                const canvas = await html2canvas(receiptPaper, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: true
                });

                canvas.toBlob(async (blob) => {
                    const receiptId = document.getElementById('receiptId').textContent;
                    const file = new File([blob], `TASKNEST-Receipt-${receiptId}.png`, { type: 'image/png' });
                    
                    if (navigator.share && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'TASKNEST Withdrawal Receipt',
                                text: `Receipt ${receiptId} - ${document.getElementById('statusBadge').textContent}`
                            });
                            showAlert('✅ Shared successfully', 'success');
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                showAlert('❌ Share failed', 'error');
                            }
                        }
                    } else {
                        // Fallback to download
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `TASKNEST-Receipt-${receiptId}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        showAlert('📥 Saved to downloads', 'success');
                    }
                    
                    shareBtn.disabled = false;
                    shareBtn.innerHTML = originalText;
                }, 'image/png', 1.0);

            } catch (error) {
                console.error('Share error:', error);
                showAlert('❌ Failed to share', 'error');
                shareBtn.disabled = false;
                shareBtn.innerHTML = originalText;
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            container.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.animation = 'slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
                setTimeout(() => alertDiv.remove(), 400);
            }, 4000);
        }

        function showError(message) {
            document.getElementById('loadingScreen').innerHTML = `
                <div class="error-card">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <h3>${message}</h3>
                    <button class="btn btn-back" onclick="goBack()" style="margin-top: 10px; width: 100%;">
                        <i class="bi bi-arrow-left"></i> Back
                    </button>
                </div>
            `;
        }

        function goBack() {
            window.location.href = 'withdraw.html';
        }

        loadReceipt();
    </script>
</body>
</html>
