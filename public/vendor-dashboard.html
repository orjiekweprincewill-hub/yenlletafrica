<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d47a1">
    <title>Vendor Dashboard - YENLLET AFRICA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-dark: #0a1628; --primary: #0d47a1; --primary-light: #1565c0; --accent: #00bcd4; --accent-light: #4fc3f7; --white: #ffffff; --off-white: #f0f4f8; --gray: #8892b0; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--off-white); color: var(--primary-dark); overflow-x: hidden; min-height: 100vh; }
        body.dark-mode { background: var(--primary-dark); color: var(--white); }
        #authLoader { position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #authLoader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: var(--white); font-size: 14px; opacity: 0.8; }
        
        .top-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 20px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon { font-size: 24px; color: var(--white); cursor: pointer; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--white); font-weight: 800; font-size: 1.4rem; }
        .logo span { background: linear-gradient(135deg, var(--white) 0%, var(--accent-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .dark-mode-toggle { background: rgba(255,255,255,0.1); border: none; color: var(--white); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .header-profile { display: flex; align-items: center; gap: 10px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: #333; }
        .username { color: var(--white); font-weight: 600; font-size: 14px; }

        .hero-bg { min-height: 100vh; background: linear-gradient(135deg, var(--primary-dark) 0%, #0d2b4e 50%, var(--primary) 100%); position: relative; overflow: hidden; padding-top: 90px; padding-bottom: 100px; }
        .main-content { position: relative; z-index: 1; padding: 20px; max-width: 600px; margin: 0 auto; }

        .glass-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); margin-bottom: 20px; color: var(--white); }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--accent-light); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.8); font-size: 14px; }
        .form-group select, .form-group input { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; color: var(--white); font-size: 14px; font-family: 'Inter', sans-serif; }
        .form-group select option { background: var(--primary-dark); }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%); color: var(--white); border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        
        .coupon-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
        .coupon-code { font-family: monospace; font-size: 16px; font-weight: 700; color: var(--accent-light); }
        .coupon-status { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .status-active { background: rgba(76, 175, 80, 0.2); color: var(--success); }
        .status-used { background: rgba(255, 152, 0, 0.2); color: #ffb74d; }
        .empty-state { text-align: center; padding: 30px; color: rgba(255,255,255,0.5); }
        .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; opacity: 0.3; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item-bottom { text-align: center; text-decoration: none; color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .nav-item-bottom i { font-size: 22px; margin-bottom: 2px; }
        .nav-item-bottom.active { color: var(--accent); }
        
        .overlay { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0; background: linear-gradient(180deg, var(--primary-dark) 0%, #0d2b4e 100%); overflow-x: hidden; transition: 0.4s; }
        .overlay-content { position: relative; width: 100%; padding: 80px 30px 30px 30px; }
        .closebtn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: var(--white); text-decoration: none; }
        .menu-list { list-style: none; }
        .menu-list a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 12px; }
        .menu-list a:hover { background: rgba(255, 255, 255, 0.05); }
        .menu-list i { font-size: 20px; color: var(--accent-light); }
        .logout-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: var(--white); border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 30px; }
        
        .alert { position: fixed; top: 80px; right: 20px; padding: 15px 20px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); z-index: 3000; color: white; font-weight: 600; }
        .alert-success { background: #4caf50; }
        .alert-error { background: #f44336; }
    </style>
</head>
<body>
    <div id="authLoader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Verifying Vendor Access...</div>
    </div>

    <div id="myNav" class="overlay">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <div class="overlay-content">
            <ul class="menu-list">
                <li><a href="dashboard.html"><i class="bi bi-house-door-fill"></i> Dashboard</a></li>
                <li><a href="withdraw.html"><i class="bi bi-cash-coin"></i> Withdraw</a></li>
                <li><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </div>

    <div class="top-header">
        <div class="header-left">
            <i class="bi bi-list menu-icon" onclick="openNav()"></i>
            <a href="vendor-dashboard.html" class="logo"><span>Yenllet Vendor</span></a>
        </div>
        <div class="header-controls">
            <div class="header-profile">
                <span class="username" id="usernameDisplay">...</span>
                <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic" id="profilePic">
            </div>
        </div>
    </div>

    <div id="alertContainer"></div>

    <div class="hero-bg">
        <div class="main-content">
            <!-- Vendor Coupon Generator -->
            <div class="glass-card">
                <div class="section-title"><i class="bi bi-ticket-perforated"></i> Generate Coupons</div>
                <form id="requestCouponsForm">
                    <div class="form-group">
                        <label>Plan</label>
                        <select id="planSelect" required>
                            <option value="YENLITE">YENLITE</option>
                            <option value="YENPRO">YENPRO</option>
                            <option value="YENVITE">YENVITE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity Requested</label>
                        <input type="number" id="countInput" placeholder="e.g. 50" min="1" required>
                    </div>
                    <button type="submit" class="btn-primary"><i class="bi bi-send"></i> Submit Request to Admin</button>
                </form>
                <div id="requestStatus" style="margin-top: 15px; text-align: center; font-size: 13px; color: var(--gray);"></div>
            </div>

            <!-- Approved Coupons List -->
            <div class="glass-card">
                <div class="section-title"><i class="bi bi-list-check"></i> Your Approved Coupons</div>
                <div id="couponsList">
                    <div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Loading coupons...</p></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="vendor-dashboard.html" class="nav-item-bottom active"><i class="bi bi-house-door-fill"></i> Home</a>
        <a href="withdraw.html" class="nav-item-bottom"><i class="bi bi-cash-coin"></i> Withdraw</a>
        <a href="profile.html" class="nav-item-bottom"><i class="bi bi-person-circle"></i> Profile</a>
    </div>

    <script>
        const API_URL = 'https://yenlletafrica.onrender.com';

        function openNav() { document.getElementById("myNav").style.width = "80%"; }
        function closeNav() { document.getElementById("myNav").style.width = "0%"; }

        async function checkAuth() {
            try {
                const res = await fetch(`${API_URL}/api/check-session`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                if (!res.ok) { window.location.href = 'login.html'; return; }
                const session = await res.json();
                
                if (!session.is_vendor) { window.location.href = 'dashboard.html'; return; }
                
                document.getElementById('usernameDisplay').textContent = session.username;
                document.getElementById('authLoader').classList.add('hidden');
                
                loadCoupons();
                loadRequests();
            } catch (err) { window.location.href = 'login.html'; }
        }

        document.getElementById('requestCouponsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const plan = document.getElementById('planSelect').value;
            const count = document.getElementById('countInput').value;
            
            try {
                const res = await fetch(`${API_URL}/api/vendor/request-coupons`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: JSON.stringify({ plan, count: parseInt(count) })
                });
                const data = await res.json();
                if (res.ok) { showAlert('✅ ' + data.message, 'success'); e.target.reset(); loadRequests(); }
                else { showAlert(data.error || 'Failed', 'error'); }
            } catch (err) { showAlert('Network error', 'error'); }
        });

        async function loadCoupons() {
            try {
                const res = await fetch(`${API_URL}/api/vendor/my-coupons`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const coupons = await res.json();
                const container = document.getElementById('couponsList');
                
                if (!coupons || coupons.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i><p>No approved coupons yet.</p></div>';
                    return;
                }

                container.innerHTML = coupons.map(c => `
                    <div class="coupon-item">
                        <div>
                            <div class="coupon-code">${c.code}</div>
                            <div style="font-size: 11px; color: var(--gray); margin-top: 4px;">${c.plan} ${c.used ? `| Used by: ${c.used_by_username || 'N/A'}` : ''}</div>
                        </div>
                        <span class="coupon-status ${c.used ? 'status-used' : 'status-active'}">${c.used ? 'USED' : 'ACTIVE'}</span>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function loadRequests() {
            try {
                const res = await fetch(`${API_URL}/api/vendor/my-requests`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const requests = await res.json();
                const statusDiv = document.getElementById('requestStatus');
                
                if (requests && requests.length > 0) {
                    const latest = requests[0];
                    if (latest.status === 'pending') {
                        statusDiv.innerHTML = `⏳ Your last request for <strong>${latest.requested_count}</strong> ${latest.plan} coupons is pending admin approval.`;
                    } else if (latest.status === 'approved') {
                        statusDiv.innerHTML = `✅ Your last request was approved! ${latest.approved_count} coupons generated.`;
                    } else {
                        statusDiv.innerHTML = `❌ Your last request was rejected.`;
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function logout() {
            try { await fetch(`${API_URL}/api/logout`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } }); } catch (e) {}
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        function showAlert(msg, type) {
            const div = document.createElement('div');
            div.className = `alert alert-${type}`;
            div.textContent = msg;
            document.getElementById('alertContainer').appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        checkAuth();
    </script>
</body>
</html>
